name: CD

# This workflow is deliberately manual. In the showcase repository it performs
# release qualification only; deployment remains skipped until the documented
# repository variable, environment approval and secret are configured.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the qualified image to the configured Fly application
        type: boolean
        default: false
      confirm_app:
        description: To deploy, enter the exact application name from FLY_APP_NAME
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run release tests
        run: npm run test:release

  container:
    name: Qualify production container
    needs: test
    # GitHub's self-repository syntax prevents runtime workspace substitution.
    uses: $/.github/workflows/release-check.yml
    with:
      upload_image: true

  deployment-gate:
    name: Validate deployment request
    if: inputs.deploy
    needs: container
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      CONFIRM_APP: ${{ inputs.confirm_app }}
      FLY_APP_NAME: ${{ vars.FLY_APP_NAME }}
      RELEASE_REF: ${{ github.ref }}
    steps:
      - name: Require an explicitly configured target
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FLY_APP_NAME" ]]; then
            echo 'Set the FLY_APP_NAME repository variable before enabling deployment.' >&2
            exit 1
          fi
          if [[ "$RELEASE_REF" != 'refs/heads/main' ]]; then
            echo 'Production deployment is restricted to the main branch.' >&2
            exit 1
          fi
          if [[ "$CONFIRM_APP" != "$FLY_APP_NAME" ]]; then
            echo 'confirm_app must exactly match FLY_APP_NAME.' >&2
            exit 1
          fi

  deploy:
    name: Deploy to Fly
    if: inputs.deploy
    needs: deployment-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP_NAME: ${{ vars.FLY_APP_NAME }}
    steps:
      - name: Check out qualified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download qualified image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualified-production-image
          path: ${{ runner.temp }}
      - name: Load qualified image
        run: docker load --input "$RUNNER_TEMP/qualified-image.tar.gz"
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1
      - name: Push qualified image
        shell: bash
        run: |
          set -euo pipefail
          flyctl auth docker
          image_tag="registry.fly.io/$FLY_APP_NAME:candidate-$GITHUB_SHA"
          docker tag pipeline-release-check "$image_tag"
          docker push "$image_tag"
          image_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image_tag")"
          if [[ ! "$image_digest" =~ ^registry\.fly\.io/.+@sha256:[a-f0-9]{64}$ ]]; then
            echo 'Could not resolve the pushed image digest.' >&2
            exit 1
          fi
          echo "IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"
      - name: Deploy qualified digest
        run: flyctl deploy --app "$FLY_APP_NAME" --config fly.toml --image "$IMAGE_DIGEST" --ha=false

  summary:
    name: Record qualification result
    if: ${{ always() && needs.test.result == 'success' && needs.container.result == 'success' }}
    needs: [test, container, deploy]
    runs-on: ubuntu-24.04
    steps:
      - name: Write summary
        shell: bash
        env:
          DEPLOY_REQUESTED: ${{ inputs.deploy }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          {
            echo '### Release candidate'
            echo
            echo '- Unit tests: passed'
            echo '- Container security and runtime checks: passed'
            if [[ "$DEPLOY_REQUESTED" == 'true' ]]; then
              echo "- Production deployment: $DEPLOY_RESULT"
            else
              echo '- Production deployment: not requested'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
